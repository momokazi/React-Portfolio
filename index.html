    <!-- Keeping Tailwind CDN for simplicity, but in a full production app you might migrate to PostCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              background: '#FFF1F2', // Very pale pink (Rose-50) instead of plain white
  primary: '#E11D48',    // Rose-600 (Bold Hot Pink)
  secondary: '#FB7185',  // Rose-400 (Softer Pink for accents)
  text: {
    dark: '#881337',     // Rose-900 (Deep Maroon - replaces black!)
    muted: '#9F1239'     // Rose-800 (Softer Maroon)
  },
              pastel: {
                peach: '#FEC0B3',
                pink: '#FFD5E9',
                lavender: '#D6BDE4',
                coral: '#FF6B6B',
                rose: '#E11D48',
                green: '#00B894',
                blue: '#4285F4',
                spotify: '#1DB954',
                violet: '#8B5CF6'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        /* Default base styles are handled by React classes, but we set a base here */
        overflow-x: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E0;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #A0AEC0;
      }
      .dark ::-webkit-scrollbar-track {
        background: #020617;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
